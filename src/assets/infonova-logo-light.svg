<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">InfoNova CRM logo for dark backgrounds</title>
  <desc id="desc">A white and orange orbital network mark followed by the white InfoNova CRM wordmark.</desc>
  <rect x="12" y="12" width="156" height="156" rx="42" fill="#fff" />
  <ellipse cx="90" cy="90" rx="54" ry="23" transform="rotate(-34 90 90)" fill="none" stroke="#F58220" stroke-width="9" />
  <ellipse cx="90" cy="90" rx="54" ry="23" transform="rotate(34 90 90)" fill="none" stroke="#8FC4F2" stroke-width="7" opacity=".95" />
  <circle cx="90" cy="90" r="15" fill="#07345F" />
  <circle cx="44" cy="61" r="9" fill="#F58220" />
  <circle cx="137" cy="119" r="9" fill="#F58220" />
  <circle cx="135" cy="58" r="7" fill="#8FC4F2" />
  <text x="202" y="94" fill="#fff" font-family="Sora, Montserrat, Arial, sans-serif" font-size="49" font-weight="700" letter-spacing="1">INFONOVA</text>
  <text x="205" y="133" fill="#F58220" font-family="Sora, Montserrat, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="8">CRM</text>
</svg>